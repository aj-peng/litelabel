name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: LiteLabel-${{ matrix.platform }}
          path: dist/LiteLabel-${{ matrix.platform }}.zip

  release:
    # attach both zips once both builds have passed, and only for version tags
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          gh release view ${{ github.ref_name }} --repo ${{ github.repository }} || gh release create ${{ github.ref_name }} --repo ${{ github.repository }} --title "LiteLabel ${{ github.ref_name }}" --generate-notes
          gh release upload ${{ github.ref_name }} dist/*.zip --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}